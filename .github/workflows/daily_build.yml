name: Autonomous Niche Affiliate Engine

on:
  schedule:
    - cron: '0 2 * * *' # Runs automatically every day at 02:00 UTC
  workflow_dispatch:     # Lets you trigger a run manually with 1 click

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Scrape Data & Synthesize High-Intent Pages
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate.py

      - name: Commit & Push Generated Pages
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/ topics.json
          git diff --staged --quiet || git commit -m "Auto-publish new B2B comparison pages"
          git push
